# The application does not call the Kubernetes API, so its ServiceAccount has no
# additional permissions. Keeping the account permissionless is intentional and
# demonstrates least-privilege workload identity.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "flask-commerce.fullname" . }}-empty
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "flask-commerce.fullname" . }}-empty
subjects:
  - kind: ServiceAccount
    name: {{ include "flask-commerce.fullname" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "flask-commerce.fullname" . }}-empty
