{{- if .Values.secret.create }}
{{- if or (eq .Values.secret.jwtSecret "CHANGE_ME") (eq .Values.secret.adminPassword "CHANGE_ME") (eq .Values.secret.postgresPassword "CHANGE_ME") }}
{{- fail "secret.create=true requires non-default jwtSecret, adminPassword, and postgresPassword values. For production use an existing Secret." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flask-commerce.secretName" . }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.secret.postgresPassword | quote }}
  JWT_SECRET: {{ .Values.secret.jwtSecret | quote }}
  ADMIN_USERNAME: {{ .Values.secret.adminUsername | quote }}
  ADMIN_PASSWORD: {{ .Values.secret.adminPassword | quote }}
{{- end }}
