apiVersion: v1
kind: Service
metadata:
  name: {{ include "flask-commerce.fullname" . }}
  labels:
    {{- include "flask-commerce.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "flask-commerce.name" . }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
