image:
  repository: YOUR_DOCKERHUB_USER/flask-commerce
  tag: "latest"
  pullPolicy: IfNotPresent

replicaCount: 3

service:
  port: 80
  targetPort: 8000

ingress:
  enabled: true
  className: nginx
  host: commerce.example.com
  tls:
    enabled: false
    secretName: flask-commerce-tls

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

hpa:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  cpuUtilization: 70

pdb:
  enabled: true
  minAvailable: 2

postgres:
  image: postgres:17
  storage: 5Gi
  database: commerce
  username: commerce

redis:
  image: redis:8-alpine

observability:
  otelEndpoint: http://otel-collector.observability.svc.cluster.local:4318
  serviceName: flask-commerce

secret:
  create: false
  existingSecret: flask-commerce-secret
  jwtSecret: CHANGE_ME
  adminUsername: admin
  adminPassword: CHANGE_ME
  postgresPassword: CHANGE_ME

networkPolicy:
  enabled: true
  otelNamespace: observability

worker:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 250m
      memory: 256Mi
